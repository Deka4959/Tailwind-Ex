<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwin Ex 1</title>

     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
    <div class="bg-white shadow-lg rounded-lg p-6 flex items-center gap-6">

    
    <div class="w-1/3">
        <img 
            src="https://plus.unsplash.com/premium_photo-1680291971376-ccc54aacb22b?w=600&auto=format&fit=crop&q=60"
            alt="Cooking">
    </div>

    
    <div class="w-2/3">
        <h1 class="font-bold text-2xl">
            Cooking Moments in the Kitchen
        </h1>

        <p class="text-gray-600 mb-4">
            This photo captures a person cooking in the kitchen while preparing
            a delicious meal. The warm atmosphere, fresh ingredients, and focused
            cooking process show creativity and passion for food.
        </p>

        <button class="bg-red-400 hover:bg-red-500 text-white px-4 py-2 rounded">
            Cooking
        </button>
    </div>

</div>

    
</body>
</html>
